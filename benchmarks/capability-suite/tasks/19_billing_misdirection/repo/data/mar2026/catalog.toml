# Kettle Cloud plan catalogue, finance-approved 2025-09-15 (rev 7)

[metrics.api_calls]
name = "API calls"
unit = "calls"
aggregation = "sum"

[metrics.storage_gb]
name = "Storage"
unit = "GB"
aggregation = "last"
precision = 3

[metrics.seats]
name = "Seats"
unit = "seats"
aggregation = "max"

[plans.starter]
name = "Starter"
currency = "USD"
base_fee = "49.00"

[[plans.starter.charges]]
metric = "api_calls"
model = "per_unit"
unit_price = "0.0005"
included = 100000

[[plans.starter.charges]]
metric = "storage_gb"
model = "per_unit"
unit_price = "0.023"
included = 50

[plans.team]
name = "Team"
currency = "USD"
base_fee = "199.00"

[[plans.team.charges]]
