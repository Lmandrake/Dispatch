# Assessment task battery.
#
# Each task is scored 0-10 by the judge against the criteria, then aggregated
# per category. Tasks are deliberately compact so a full battery stays within
# the free-tier rate budget. `modality` selects which models run the task.
#
# Categories map to the workflow portions we might delegate to a free model:
#   coding, reasoning, extraction (structured output), instruction (following
#   precise constraints), summarization, creative, long_context, vision.

tasks:
  - id: code_fix_bug
    category: coding
    modality: [chat, code]
    max_tokens: 1200
    prompt: |
      This Python function is supposed to return the first duplicate value in a
      list, or None if there are no duplicates. It has a bug. Return the corrected
      function only, in a single code block, with a one-line explanation of the bug.

      def first_dup(xs):
          seen = set()
          for x in xs:
              if x in seen:
                  return seen
              seen.add(x)
          return None
    criteria: |
      Correctly returns `x` (not `seen`) on the duplicate. Code runs. Explanation
      identifies the wrong return value. Clean single code block.

  - id: code_write_util
    category: coding
    modality: [chat, code]
    max_tokens: 2000
    prompt: |
      Write a Python function `chunk_iterable(it, n)` that yields successive
      lists of up to n items from any iterable, without loading the whole
      iterable into memory. Include 3 doctest examples and handle n <= 0 by
      raising ValueError.
    criteria: |
      Uses itertools.islice or equivalent lazy approach (not list(it)). Correct
      chunking. Valid doctests. Raises ValueError for n<=0. Idiomatic.

  - id: reason_logic
    category: reasoning
    modality: [chat, code]
    max_tokens: 2500
    prompt: |
      Three boxes are labeled "Apples", "Oranges", and "Apples & Oranges". Every
      label is wrong. You may draw one fruit from one box without looking inside.
      Which box do you draw from to correctly label all three, and what is the
      full deduction? Answer concisely.
    criteria: |
      Draws from the "Apples & Oranges" box. Correct, complete deduction chain
      for relabeling all three given all labels are wrong.

  - id: reason_math
    category: reasoning
    modality: [chat, code]
    max_tokens: 2800
    prompt: |
      A tank can be filled by pipe A in 6 hours and pipe B in 4 hours. A drain C
      empties it in 12 hours. All three are open. How long to fill the empty
      tank? Show the rate arithmetic and give the answer as a fraction of hours.
    criteria: |
      Rates 1/6 + 1/4 - 1/12 = 1/3 per hour; answer 3 hours. Correct arithmetic
      shown.

  - id: extract_json
    category: extraction
    modality: [chat, code]
    max_tokens: 1000
    prompt: |
      Extract the following into strict JSON with keys name, role, company,
      years_experience (integer), skills (array of strings). Output ONLY the
      JSON, no prose, no code fence.

      "Pat Example is a staff ML engineer at Example Robotics (an invented person) where she's spent the
      last 8 years building perception stacks in C++, CUDA, and Python."
    criteria: |
      Valid parseable JSON, exact keys, years_experience is integer 8, skills
      captures C++/CUDA/Python, no extra prose or code fence.

  - id: instruction_constraints
    category: instruction
    modality: [chat, code]
    max_tokens: 1200
    prompt: |
      Write exactly three sentences about the ocean. The second sentence must
      contain the word "bioluminescence". No sentence may exceed twelve words.
      Do not use the letter "z".
    criteria: |
      Exactly three sentences. Sentence 2 contains "bioluminescence". Each <= 12
      words. No letter z anywhere. Follows every constraint precisely.

  - id: summarize_faithful
    category: summarization
    modality: [chat, code]
    max_tokens: 900
    prompt: |
      Summarize the passage in 2 sentences for a busy executive. Do not add facts.

      "The migration moved 12 services from a monolith to Kubernetes over three
      quarters. Latency p99 dropped 40% but on-call load rose because alerting
      was not migrated in lockstep. The team paused new feature work in Q3 to
      stabilize, then resumed in Q4 with an SRE hire."
    criteria: |
      Faithful, no invented facts, 2 sentences, captures the tradeoff (latency
      win vs on-call cost) and the pause/hire.

  - id: creative_svg
    category: creative
    modality: [chat, code]
    max_tokens: 1500
    prompt: |
      Produce a minimal, valid standalone SVG (200x200) of a stylized paper
      airplane. Output only the SVG markup.
    criteria: |
      Well-formed <svg> that would render. Recognizable paper airplane shape via
      polygons/paths. Correct viewBox/dimensions. Only SVG, no prose.

  - id: vision_describe
    category: vision
    modality: [vision]
    max_tokens: 1000
    image: chart.png
    prompt: |
      What does this image show? If it is a chart, report the trend and any
      labeled values you can read.
    criteria: |
      Correctly identifies the image content; for the test chart, reads the
      upward trend and approximate labeled values.
