[project]
name = "nemotron-bridge"
version = "0.1.0"
description = "Make NVIDIA's free build.nvidia.com models trivial to use in multi-model workflows."
requires-python = ">=3.10"
dependencies = [
    "openai>=1.40",
    "pyyaml>=6.0",
    "rich>=13.0",
    "pillow>=10.0",
    "tenacity>=8.0",
    "tabulate>=0.9",
    "httpx>=0.27",
]

[project.scripts]
nemo = "cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["cli"]
packages = ["nemotron_bridge", "nemotron_bridge.probes"]
